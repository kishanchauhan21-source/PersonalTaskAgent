[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-task-agent"
version = "0.1.0"
description = "A personal task planner that turns natural-language notes into a balanced daily schedule."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1.0", "pydantic>=2.6,<3.0", "uvicorn[standard]>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]
